name: PS5 stock monitor
on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send harmless test Telegram message"
        type: boolean
        default: false
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: write
concurrency:
  group: ps5-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest -v tests
      - name: Optional Telegram test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py --test-telegram
      - name: Check PlayStation Direct
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SAVE_HTML: ${{ github.event_name == 'workflow_dispatch' }}
        run: python monitor.py --once
      - name: Persist stock data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: latest stock check [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload HTML evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sony-html-snapshots
          path: evidence/*.html.gz
          if-no-files-found: ignore
          retention-days: 2
  pages:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
